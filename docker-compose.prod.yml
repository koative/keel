name: keel

# Deployable topology. `docker-compose.yml` is a development file and copying it to
# a server is the mistake this file exists to prevent: it publishes Postgres on the
# host, pins `NODE_ENV=development`, and its healthcheck-gated `web` would happily
# serve against a schema nobody migrated.
#
# Six deliberate differences from dev:
#
#   1. Every value arrives from the deploy environment in the `${VAR:?...}` form, so
#      a missing one fails the deploy naming itself. Neither file defaults anything;
#      what dev reads from `apps/server/.env`, this reads from the deploy's own
#      environment, and the two never share a value by accident.
#   2. Migrations run as a one-shot service that everything else gates on, so no
#      process ever serves traffic against a stale schema and no replica races
#      another to migrate.
#   3. Postgres publishes nothing. Services reach it over the compose network, and
#      the server is `expose`d rather than published so a reverse proxy owns the
#      edge.
#   4. Logs are size-capped. The default json-file driver grows without bound, and
#      a disk filled by container logs takes down everything on the host.
#   5. The database is dumped on a schedule and old dumps are pruned. Dev has no
#      backup because dev has nothing to lose; a deployment that ships a Postgres
#      volume and no restore path has everything to lose and does not know it.
#   6. Maintenance runs on a schedule. Dev has no `tasks` service because a dev
#      database that grows is one somebody drops; here nothing else requeues the job
#      a crashed worker left `running`, and nothing else prunes the four tables that
#      grow for the life of the deployment.
#
# TLS and routing are deliberately not here. Terminate them in whatever already
# owns your domain — Traefik, Caddy, nginx, or a PaaS — and point it at `server`
# on port 3000. A proxy invented by a boilerplate is a proxy nobody configured.
#
#   docker compose -f docker-compose.prod.yml up -d --build

x-app-env: &app-env
  # One env block for every service that imports @keel/env, because that schema is
  # validated as a whole: the migrator reaches Postgres through the same `db`
  # singleton as the server, so it parses the same variables even though it only
  # uses DATABASE_URL.
  #
  # Required keys use `:?`. The `:-` form appears only for keys @keel/env itself
  # marks optional, where it passes an absent variable through as absent rather
  # than inventing a value — `emptyStringAsUndefined` turns the empty string back
  # into `undefined` on the other side.

  # AI is opt-in and both halves are guarded together by `resolveAi`, which throws
  # on the first `ai.generate` job naming whichever is unset. Forwarded in the `:-`
  # form so a deployment that never enqueues one still deploys.
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
  BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:?BODY_LIMIT_BYTES is required}
  CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:?DATABASE_POOL_MAX is required}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
  LOG_DRAIN: ${LOG_DRAIN:?LOG_DRAIN is required, and on a server it is otlp}
  # `resend` is the only value that boots here. This file pins NODE_ENV=production
  # below, and the worker refuses `log` there — it prints every verification and
  # reset link into the json-file logs this file then retains. `resend` also needs
  # RESEND_API_KEY, and a MAIL_FROM on a domain verified with Resend — the sandbox
  # sender in .env.example reaches nobody but the account owner, and the server
  # refuses to start on it too.
  MAIL_DRIVER: ${MAIL_DRIVER:?MAIL_DRIVER is required, and on a server it is resend}
  MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
  NODE_ENV: production
  OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
  OTLP_HEADERS: ${OTLP_HEADERS:-}
  RATE_LIMIT_READ_PER_MINUTE: ${RATE_LIMIT_READ_PER_MINUTE:?RATE_LIMIT_READ_PER_MINUTE is required}
  RATE_LIMIT_WRITE_PER_MINUTE: ${RATE_LIMIT_WRITE_PER_MINUTE:?RATE_LIMIT_WRITE_PER_MINUTE is required}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  # Keys the AES-256-GCM cipher in `@keel/crypto/seal`. A deployment that stores no
  # third-party secrets needs none, and the code path that reads it refuses rather
  # than writing plaintext.
  SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
  STATEMENT_TIMEOUT_MS: ${STATEMENT_TIMEOUT_MS:?STATEMENT_TIMEOUT_MS is required}
  # An S3-compatible bucket. Every key is optional, provider included: nothing in the
  # starter stores a file yet, so `resolveStorage()` is the guard and it throws naming
  # whichever is missing the first time storage is asked for. Which of these a
  # deployment sets depends on STORAGE_PROVIDER — see .env.example.
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
  STORAGE_ACCOUNT_ID: ${STORAGE_ACCOUNT_ID:-}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-}
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
  STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-}
  STORAGE_REGION: ${STORAGE_REGION:-}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
  # Better Auth reads x-forwarded-for by default even when nothing is configured, so
  # an unset header is not a coarse shared bucket — it is a bucket the caller picks.
  # The server refuses to start with NODE_ENV=production unless TRUSTED_IP_HEADER
  # names the header the proxy in front of it rewrites and TRUSTED_PROXIES lists
  # every hop as IPs or CIDR ranges. Left `:-` rather than `:?` on purpose: migrate
  # and worker share this block and neither serves an authenticated request.
  TRUSTED_IP_HEADER: ${TRUSTED_IP_HEADER:-}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  # Pinned rather than inherited from the base image, because the Better Auth tables
  # use `timestamp` without a zone while domain tables use `timestamptz`. A base
  # image that changes its default would silently desync the two.
  TZ: UTC
  # The shared key the webhook receiver verifies against. Optional because
  # receiving webhooks is opt-in; the receiver refuses a delivery with a 503
  # naming this key when it is unset, so an unset key is loud, never a silent
  # unverified accept.
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
  WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:?WORKER_BATCH_SIZE is required}
  WORKER_POLL_MS: ${WORKER_POLL_MS:?WORKER_POLL_MS is required}

x-logging: &logging
  driver: json-file
  options:
    max-file: "5"
    max-size: 10m

services:
  # Runs to completion, then exits. `server` and `web` gate on that exit, which is
  # what makes "migrate once, then start N instances" structural rather than a
  # convention someone has to remember.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["bun", "dist/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    logging: *logging
    # Never restart: a failed migration must stop the deploy and stay readable, not
    # loop until the schema is half-applied.
    restart: "no"

  # Same image as the server, different command. Background work is a separate
  # process rather than a timer inside the API for two reasons: a `setInterval`
  # runs once per replica, so N replicas do the same work N times, and a slow job
  # would otherwise compete with request handling for the same event loop.
  #
  # Scale it with `--scale worker=N`. The claim query takes rows `FOR UPDATE SKIP
  # LOCKED`, so replicas never hand each other the same job and no coordination
  # service is needed.
  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["bun", "dist/worker.mjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment: *app-env
    # No healthcheck: the worker serves no port, and liveness for a poller is a
    # different question — an idle queue looks identical to a wedged loop from
    # outside. Its wide events are the signal.
    init: true
    logging: *logging
    restart: unless-stopped

  # Periodic maintenance, on the same image as `worker` with a different command.
  # Without this service the topology has no owner for two problems, and both are
  # invisible until they are expensive: a worker killed mid-job leaves its row
  # `running` and claimed by a process that no longer exists, and nothing else ever
  # requeues it; and four tables — spent idempotency keys, auth rate-limit counters,
  # idle token buckets, settled jobs — grow for the life of the deployment.
  # `dist/tasks.mjs` is what fixes both, and it is a one-shot process that exits, so
  # it needs something to run it on an interval.
  #
  # That something is `tools/tasks.sh`, a sleep loop, for the same reason `backup`
  # below has one rather than a cron daemon this image does not ship. Sweeps first,
  # sleeps after, so a deploy reclaims whatever the previous one stranded going down.
  #
  # Do not `--scale` this. Overlapping runs are harmless — every statement skips
  # locked rows — but a second replica only looks for rows the first already took.
  tasks:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    # The interval is an argument rather than an environment key so this service
    # forwards `*app-env` unchanged like every other one. Required in the `${VAR:?}`
    # form and absent from @keel/env on purpose: the app reads no schedule, the same
    # reason BACKUP_INTERVAL_HOURS is only ever a compose variable. Minutes, because
    # it is the ceiling on how long a job stranded by a dying worker stays stranded.
    command:
      [
        "/bin/sh",
        "/opt/keel/tasks.sh",
        "${TASKS_INTERVAL_MINUTES:?TASKS_INTERVAL_MINUTES is required, and it is also how long a stranded job waits to be requeued}",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment: *app-env
    logging: *logging
    # Covers the container dying, never a bad sweep: `dist/tasks.mjs` exits 1 when a
    # sweep failed and the loop deliberately keeps running, because restarting on a
    # failed sweep would sweep again immediately against a database already refusing.
    restart: unless-stopped
    volumes:
      # From the checkout `build: context: .` already requires on this host, read-only
      # because nothing in the container has any business editing the loop it runs.
      - ./tools/tasks.sh:/opt/keel/tasks.sh:ro

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment: *app-env
    # Not published: the reverse proxy that terminates TLS routes your domain here.
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    logging: *logging
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the bundle at build time, so this is a build concern rather
        # than a runtime one: changing the API origin needs a rebuild.
        VITE_SERVER_URL: ${VITE_SERVER_URL:?VITE_SERVER_URL is required}
    depends_on:
      server:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    init: true
    logging: *logging
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: postgres
      PGTZ: UTC
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    # No `ports`. Reaching this from outside the compose network is a decision that
    # should require editing this file, not the default.
    restart: unless-stopped
    volumes:
      - keel_postgres_data:/var/lib/postgresql

  # A logical dump of the database on a fixed interval, into a named volume, with
  # everything past the retention horizon deleted. `tools/backup.sh` is the loop; the
  # image is pinned to the same major as `postgres` above because pg_dump refuses a
  # server newer than itself, so a client left a major behind is how backups stop the
  # day Postgres is upgraded.
  #
  # What this is not is point-in-time recovery. A restore lands on the last dump and
  # everything written after it is gone, which makes BACKUP_INTERVAL_HOURS the data a
  # disaster costs rather than a tuning knob. The README says what PITR needs instead.
  #
  # The volume is on this host, so a host that dies takes the database and every dump
  # with it. Copying them somewhere else is the half of a backup no compose file can
  # do for you.
  #
  #   docker compose -f docker-compose.prod.yml exec backup ls -l /backups
  #   docker compose -f docker-compose.prod.yml exec backup /opt/keel/restore-drill.sh
  backup:
    command: ["/bin/sh", "/opt/keel/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Neither key is in @keel/env and neither belongs there — the app never reads a
      # backup schedule, the same reason POSTGRES_DB is only ever a compose variable.
      # Both arrive from the deploy rather than being pinned here, because both
      # answers belong to the deployment: the interval is the recovery point it
      # accepts, and the retention is its disk.
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:?BACKUP_INTERVAL_HOURS is required, and it is also the window a restore loses}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:?BACKUP_RETENTION_DAYS is required}
      # The libpq variables, which pg_dump, pg_restore and psql each read themselves.
      # The dump and the restore drill therefore share one spelling of the connection
      # and neither script parses a URL.
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGUSER: postgres
    image: postgres:18
    logging: *logging
    restart: unless-stopped
    volumes:
      # Both scripts come from the checkout `build: context: .` already requires on
      # this host, mounted read-only because nothing in here has any business editing
      # them. The command is not `postgres`, so the image's entrypoint execs it as
      # root and a freshly created volume is writable; `umask 077` in the script is
      # what keeps a dump of every row from being readable to anything else that
      # mounts it.
      - ./tools/backup.sh:/opt/keel/backup.sh:ro
      - ./tools/restore-drill.sh:/opt/keel/restore-drill.sh:ro
      - keel_backups:/backups

volumes:
  # Named rather than a bind mount: a path on the host is one more thing to create,
  # own and get the mode right on before the first dump, and the dumps are read
  # through `exec backup` either way.
  keel_backups:
  keel_postgres_data:
