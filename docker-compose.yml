name: keel

# The development stack. Every variable below is required and none of them is
# defaulted here, so `docker compose up` needs a `.env` beside this file — copy
# `.env.example` and fill it in. A default in this file would be a second answer to
# a question `.env` already answers, and the two would disagree the first time
# somebody moved a port: compose would come up on one number while `bun run dev`
# used the other, and the CORS failure that follows names neither.
#
# Published ports are variables so a second checkout can run beside this one — a
# boilerplate gets cloned repeatedly on one machine, and a fixed 3000 means the
# second copy cannot come up at all. Only the HOST side moves; containers always
# listen on 3000, so healthchecks and the Dockerfile never learn about the mapping.
#
#   SERVER_PORT=4000 WEB_PORT=4001 POSTGRES_PORT=5442 docker compose up
#
# Avoid 6000: Chrome refuses it as ERR_UNSAFE_PORT, which presents as a page that
# will not load with nothing wrong on the server.

# The three services that import @keel/env share this block. That schema is
# validated as a whole, so the migrator parses every variable even though it only
# uses DATABASE_URL — and NODE_ENV is here rather than inherited from the image,
# which pins `production` for the deployable case. This stack serves http://localhost
# from two origins; `development` is what better-auth reads to pick the cookie
# SameSite that works there.
x-app-env: &app-env
  BETTER_AUTH_URL: http://localhost:${SERVER_PORT:?SERVER_PORT is required (see .env.example)}
  CORS_ORIGIN: http://localhost:${WEB_PORT:?WEB_PORT is required (see .env.example)}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}@postgres:5432/keel
  NODE_ENV: development

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: http://localhost:${SERVER_PORT:?SERVER_PORT is required (see .env.example)}
    init: true
    ports:
      - "${WEB_PORT:?WEB_PORT is required (see .env.example)}:80"
    env_file:
      - path: apps/web/.env
        required: false
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    ports:
      - "${SERVER_PORT:?SERVER_PORT is required (see .env.example)}:3000"
    # Everything @keel/env requires and this file does not pin comes from here —
    # BETTER_AUTH_SECRET, MAIL_DRIVER, MAIL_FROM, LOG_DRAIN and the tuning numbers.
    # Without the file the container exits at startup naming the first missing key,
    # which is the same failure `bun run dev` gives; see .env.example.
    env_file:
      - path: apps/server/.env
        required: false
    environment: *app-env
    # /ready, not /. Liveness and readiness answer different questions: / and
    # /health say the process is up and should not be restarted, /ready says it
    # can serve traffic — which means Postgres answered. Compose only has one
    # healthcheck and it gates `depends_on`, so it has to be the readiness one;
    # pointing it at a route that returns 200 unconditionally reported the
    # container healthy with a dead database and let `web` start behind it.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Same one-shot gate as production, for the same reason: without it `up` produced
  # a stack that reported healthy against an empty database and returned 500 for
  # every request. `db:push` is for iterating on the schema from the host; the
  # container path applies the committed migrations, so what runs here is what will
  # run on a server.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["bun", "dist/migrate.mjs"]
    env_file:
      - path: apps/server/.env
        required: false
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Same image as the server, different command. Present in dev too, because a
  # queue nobody drains locally is a queue whose handlers are first exercised in
  # production.
  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["bun", "dist/worker.mjs"]
    env_file:
      - path: apps/server/.env
        required: false
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: keel-postgres
    environment:
      POSTGRES_DB: keel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required (see .env.example)}:5432"
    volumes:
      - keel_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Integration tests run against a real Postgres, never against the dev
  # database. Storage is tmpfs so every `up` starts from an empty cluster and
  # a crashed test run cannot leave state behind. Guarded by a profile so
  # `docker compose up` does not start it.
  #
  # TEST_DATABASE_URL in `.env.test` has to agree with the password and port here.
  postgres-test:
    image: postgres:18
    container_name: keel-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_DB: keel_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
    ports:
      - "${POSTGRES_TEST_PORT:?POSTGRES_TEST_PORT is required (see .env.example)}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  keel_postgres_data:
