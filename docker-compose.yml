name: keel

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: http://localhost:3000
    init: true
    ports:
      - "3001:80"
    env_file:
      - path: apps/web/.env
        required: false
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    ports:
      - "3000:3000"
    # BETTER_AUTH_SECRET has no safe default, so it must come from here. Without
    # it the container exits at startup naming the missing key — see .env.example.
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/keel
    # /ready, not /. Liveness and readiness answer different questions: / and
    # /health say the process is up and should not be restarted, /ready says it
    # can serve traffic — which means Postgres answered. Compose only has one
    # healthcheck and it gates `depends_on`, so it has to be the readiness one;
    # pointing it at a route that returns 200 unconditionally reported the
    # container healthy with a dead database and let `web` start behind it.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Same one-shot gate as production, for the same reason: without it `up` produced
  # a stack that reported healthy against an empty database and returned 500 for
  # every request. `db:push` is for iterating on the schema from the host; the
  # container path applies the committed migrations, so what runs here is what will
  # run on a server.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["bun", "dist/migrate.mjs"]
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/keel
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18
    container_name: keel-postgres
    environment:
      POSTGRES_DB: keel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - keel_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Integration tests run against a real Postgres, never against the dev
  # database. Storage is tmpfs so every `up` starts from an empty cluster and
  # a crashed test run cannot leave state behind. Guarded by a profile so
  # `docker compose up` does not start it.
  postgres-test:
    image: postgres:18
    container_name: keel-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_DB: keel_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  keel_postgres_data:
