# Static files are a solved problem, which is the whole reason this is nginx and
# not three lines of Bun.serve: conditional GET, ETag revalidation, byte ranges,
# encoding negotiation and path traversal are all things you get here for free and
# would otherwise reimplement, in a place where the upside is one fewer image.
#
# Load-bearing nginx behaviour: `add_header` in a location block REPLACES every
# add_header inherited from the server block rather than adding to it. So each
# location that sets one has to restate the rest, and the failure mode is silent —
# the headers simply are not there. Same shape as the Hono middleware ordering bug
# in the API's CSP, and just as invisible in review.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    # `text/javascript` as well as `application/javascript`: nginx's own mime.types
    # maps .js to the former on current builds, so listing only the latter left
    # every script uncompressed.
    gzip_types text/css text/javascript text/plain application/javascript application/json application/manifest+json image/svg+xml;
    # Below ~1 KB the header overhead outweighs the saving.
    gzip_min_length 1024;
    # Without this a shared cache can serve a gzipped body to a client that did not
    # ask for one.
    gzip_vary on;
    gzip_proxied any;

    # Vite content-hashes everything under /assets/, so a URL here can never change
    # meaning and a year is safe. index.html deliberately falls outside this block.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
    }

    # The shell and the service worker are the two unhashed, mutable files. Cached,
    # they pin a client to an old build whose immutable assets are still valid — so
    # the app keeps working and keeps being wrong, which is worse than breaking.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
    }

    # No Content-Security-Policy, and not by oversight. A useful one needs
    # `connect-src` to name the API origin, which lives in VITE_SERVER_URL — a build
    # argument nginx never sees, and which is a different origin from this one under
    # the default ports. A guessed policy blocks every request the app makes and
    # presents as an app that loads and does nothing. Set it here once the origin is
    # known for a given deployment.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
    }
}
