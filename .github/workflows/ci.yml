name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A `run:` step with no `shell:` key is invoked as `bash -e {0}` — `-e`, and no
# `pipefail`. That makes a pipeline's exit status the last command's, so
# `bun run check | tee` reported the exit code of `tee`, which is always 0, and
# every gate in this workflow passed on a red tree. `shell: bash` is what
# supplies `-eo pipefail`; declaring it once here is what stops the next pipe
# from reintroducing the same silence.
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The integration suites skip themselves when this is unreachable, which is
    # exactly what must never happen in CI. Starting it here is what makes the
    # repository and route tests actually run.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: keel_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:password@localhost:5433/keel_test
      # Every drain except `none` writes somewhere. `fs` would leave .evlog/logs
      # in the workspace and slow every suite down for output nobody reads.
      LOG_DRAIN: none

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Apply migrations to the test database
        run: bun run db:test:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # typecheck, tests, lint, catalog drift, and the architecture rules. The
      # tee pipe cannot mask a failure because `defaults.run.shell` supplies
      # `pipefail` — without it this step is green whatever `check` returns.
      - name: typecheck, tests, lint, catalog drift, and the architecture rules
        run: bun run check 2>&1 | tee /tmp/check.log

      # A skipped integration suite is a green build that proved nothing, so the
      # count is asserted rather than trusted. The log is that one turbo run, so
      # a skip anywhere — server, mail, or any package — is caught, not just the
      # server's own suite run again.
      - name: Fail if any test was skipped
        run: |
          if grep -qE '(^|:)[[:space:]]*[1-9][0-9]* skip|\(skip\)' /tmp/check.log; then
            echo "::error::integration tests were skipped — the test database was not reachable, or a generated module's repository is still throwing"
            exit 1
          fi

      - run: bun run build

  # Deliberately its own job and not a step in `check`.
  #
  # `bun audit` reports the whole installed tree and Bun 1.3 has no --prod or
  # --omit=dev flag, so it cannot be scoped to what actually ships. Every
  # advisory this repository has today comes from build tooling — esbuild via
  # drizzle-kit, vite and tsdown; sharp via @vite-pwa/assets-generator — none of
  # which is reachable at runtime and none of which has a fix at the pinned
  # versions. Gating the build on `--audit-level=high` would therefore fail main
  # on day one with nothing a reviewer could do about it, and a red main that
  # nobody can fix is how a team learns to ignore CI.
  #
  # So the report is always produced and visible, and only `critical` stops the
  # world: that severity is worth interrupting for even in a dev dependency.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Report every advisory
        run: bun audit || true

      - name: Fail on a critical advisory
        run: bun audit --audit-level=critical
